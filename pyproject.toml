[project]
name = "edgeeagle-workspace"
version = "0.0.0"
description = "EdgeEagle Python workspace; not a deployable application"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.40,<2",
    "boto3-stubs[s3]>=1.40,<2",
    "hatchling>=1.27,<2",
    "httpx>=0.28,<0.29",
    "mypy>=1.15,<2",
    "pip-audit==2.10.1",
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
    "psycopg[binary]>=3.2,<4",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/api/src", "apps/api/tests", "apps/api/migrations", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests", "tests/unit"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
