services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: edgeeagle
      POSTGRES_PASSWORD: edgeeagle-local
      POSTGRES_DB: edgeeagle
    ports:
      - "127.0.0.1:${EDGEEAGLE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeeagle -d edgeeagle"]
      interval: 2s
      timeout: 3s
      retries: 30
  floci:
    image: floci/floci:2.1.0
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "false"
    ports:
      - "127.0.0.1:${EDGEEAGLE_FLOCI_PORT:-4566}:4566"
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
  mock-providers:
    build:
      context: ./tests
      dockerfile: mock_providers/Dockerfile
    ports:
      - "127.0.0.1:${EDGEEAGLE_MOCK_PROVIDER_PORT:-9080}:9080"
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/health', timeout=2).close()",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  floci-data:
