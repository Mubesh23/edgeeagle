name: Foundation validation

on:
  pull_request:
  push:
    branches: [main, master, "chore/**", "feat/**", "fix/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.3"
          python-version: "3.11"
          enable-cache: false
      - name: Prepare package manager and check Docker
        run: |
          npm install --global corepack@0.34.6
          docker info
          docker compose version
      - name: Bootstrap locked dependencies
        run: scripts/bootstrap
      - name: Validate foundation
        run: scripts/validate
      - name: Check for tracked-file changes
        run: git diff --exit-code
      - name: Stop local services without deleting volumes
        if: always()
        run: scripts/local-down
