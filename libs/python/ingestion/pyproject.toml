[project]
name = "edgeeagle-ingestion"
version = "0.0.0"
description = "EdgeEagle raw acquisition application boundary and offline adapters"
requires-python = ">=3.11,<3.12"
dependencies = ["edgeeagle-domain"]

[tool.uv.sources]
edgeeagle-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeeagle_ingestion"]
